diary1=Diary note 1
diary1_text=It was the first day in the house. There were no dreams. It's good. For the first time in a long time I held a normal morning. Breakfasted and washed like a normal person. I looked around the house. Here I have things to do, for example, try to open locked doors. I think everything is getting better. This rest would do me good.
diary2=Diary note 2
diary2_text=The second day passed. Why am I writing this? What the hell is going on? This house hides a more than I could have imagined. What is this hidden room? It is specially made invisible, but because of the elapsed time it became visible. The room looks like some kind of office, there are many strange books and notes, which refer to the catacombs under the house. What I can tell about catacombs? What is it?! It is something like a huge system of underground corridors? What is it for? Using a map, I found something like a well. I heard strange sounds from there. It was like knocking and noises. I saw a tall man. This man was in my dream. What did he say? That was real?
diary3=Diary note 3
diary3_text=Now, I realized something. Almost all the time I was running away from the fact that bothers me. Those things that happened to me ... The majority of people thinks it is a trifle. But for me it's a real problem. Just now I know that I have no other way. I have no choice. I know where I should go. How do I know? I do not understand. Life is full of strange events. What is happening now? It is very strange.
olddiary1=Old diary 1
olddiary1_text=My quest is proceeding well. Relations with the family seem to be normal. They do not suspect anything about my affairs. It's good. I read some interesting books that gave me Archibald. One of them speaks about the catacombs of unknown origin in various parts of the world. Their description is similar to what I've seen under our house. Some researchers suggest that it was built in the Middle Ages by sectarians, beliefs which remain unknown. But what force should have a similar organization to create such large-scale construction? Their purpose is also not yet clear. There is no way out, I did not find. Any traces of human activity, either. It is necessary to continue research.
olddiary2=Old diary 2
olddiary2_text=I installed a ladder in the barn, so you can easily get into the catacombs. I also set the grate with a lock in the catacombs, just in case. Every day I lock the barn on the night. On the questions of my wife I say that she can spoil everything and hurt himself. And it's really true! This finding may come as a shock for the unprepared human. A person can be enough folly to go into the catacombs, and he can get lost and not come out.
olddiary3=Old diary 3
olddiary3_text=I have been drawing map of catacombs. They are a network of rooms with inputs and outputs. I divided a piece of paper into equal squares and began to paint the individual squares, which are the walls. Login I outlined in blue. All map legend I described on the other side. There are many forks and dead ends, but one thing I know for sure. There is one room that should be very interesting.
olddiary4=Old diary 4
olddiary4_text=Today, I almost lost myself here. I have to be careful. The deeper I go, the harder it becomes to remember routes. I decided to draw a pencil line that will show where I was, so you can always come back. Every time I erase the old line and start a new drawing. This can wear out my map ahead of time, but I hope it will not happen so soon.
olddiary5=Old diary 5
olddiary5_text=I found! Found! In the last deadlock, I found a hole in the floor. I watched and noticed a couple of things. I have not found bottom. But I heard some sounds coming from there. Describing them is difficult, but I can assume something. These sounds may have a biological nature. I cannot be absolutely sure, and anyone who heard it would consider me crazy. But Archibald can listen to my thoughts. It will be necessary to contact him.
olddiary6=Old diary 6
olddiary6_text=Archibald came to me a couple of days ago. He will stay here for a couple of weeks. Tomorrow we will come together to explore the catacombs. I am sure he will notice something interesting. I heard strange sounds from his bedroom at night. It was like a prayer or something similar. Our bedrooms are side by side, and I could hear it. I asked my wife what she thinks about it. But she says she did not hear anything. I think she don't want to see Archibald in our home. Son also sidelined him, despite all his good nature. Most part of the time they simply ignore him as if he is not here. I think it will take time and they will take him.
olddiary7=Old diary 7
olddiary7_text=I visited the catacombs with the Archibald. He heard the sounds from the well too. We discussed their nature all day. Now we are sure that they come from a living creature. We need to find a way to interact with it. We need to understand how it exists. Perhaps this form of life, which have not met a single person in history! I cannot wait to continue to work on this.
olddiary8=Old diary 8
olddiary8_text=Damn! This scum disappeared somewhere, and with him and my family! What the hell is going on. I checked everywhere, even went to the forest and catacombs. Stop. I have not looked at the basement! Idiot! How could I forget it?! There's no time, I'm going there.
letter1=Letter 1
letter1_text=Honey, when you read these lines, I'll be on the road home. You cannot imagine how I miss you and son. He was only six when I left, and now he is eight. Time has flown by so quickly. And this terrible war played its role. This world has not seen such things. In my travels I met a very interesting person. If you could talk with him! No time, wait for more letters. I love you.
letter2=Letter 2
letter2_text=I took the time to write you a few lines. See you soon. It is unfortunate that I have so little time. I cannot accept letters, but it does not prevent me to continue to write to you. Remember when I talked about my new friend? Maybe he can came and stay with us for some time. It makes me happy. He is a really interesting man, and with him our research can become something really meaningful. Perhaps we can deal with those interesting phenomena taking place just in the area where our house.
letter3=Letter 3
letter3_text=Honey, I've been thinking about what's going on between us. I hope you will forgive me, and we can begin to live again as a happy family. I really believe that. I just really need to sort things out.
letter4=Letter 4
letter4_text=I want to tell you a strange story that happened to me a couple of days ago. For the second day, I suffered from insomnia. There's nothing I could do with it, so the only thing I could do is to continue to work by candle light. I'm feeling very tired, but sleep did not come to me. I started noticing some strange noises outside the hotel where I was staying. I went to window to look out and see what happens there. At first I did not notice anything, but after a few seconds I saw a man. He just stood there. Suddenly I noticed something. He looked like me. He really looked exactly like me. In the excitement, I ran into the street, but there was nobody.
letter5=Letter 5
letter5_text=Hello, Archibald! I'm at home with my family. We really missed each other. I dare to assure you that our journey has given the benefit to my work. Those books that you gave me told me a lot. I made a map of the catacombs that are under my house. Installed descent into the barn, but not showed it to family. They think that I just work there, but they do not need to know where I am in reality. This can cause meaningless anxiety. I can write something about the catacombs. There's almost nothing, but one route is somewhere deeper. It's deeper than you can imagine. I have not yet dared to go there, but I must do it someday. After all, there can be thing that I was looking for.
letter6=Note
letter6_text=Do not look for me.
book1=Old book
book1_text=...Similar catacombs are found not only in Europe but also in Siberia, Africa, and, oddly enough, in the New World. The organization which has built them seems to be very ancient and strong. Each of these labyrinths has an input and something like a well in the most hidden areas of the catacombs. Nobody was able to test their depth. The researchers said that they heard a sound like a knock out of the well. Due to their extreme rarity define their nature is not possible ...                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   
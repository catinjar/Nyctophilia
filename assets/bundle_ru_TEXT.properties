diary1=Запись в дневнике 1
diary1_text=Прошел первый день в доме. Ничего не снилось. Это хорошо. Впервые за несколько дней провел нормально утро. Позавтракал и помылся как нормальный человек. Осмотрел дом. Тут есть чем заняться, например, попробовать открыть закрытые двери. Думаю, все налаживается. Этот отдых пойдет мне на пользу.
diary2=Запись в дневнике 2
diary2_text=Подошел к концу второй день. Зачем я это пишу? Какого черта происходит? Этот дом несет в себе больше, чем я мог себе представить. Что это за скрытая комната? Ее специально сделали незаметной, но из-за прошедшего времени она стала заметной. Комната похожа на какой-то кабинет, в ней много странных книг и записей, в которых упоминаются катакомбы под домом. Кстати о катакомбах. Что это вообще?! Откуда тут взялась эта огромная система коридоров под землей? Зачем они нужны? С помощью карты я нашел что-то вроде колодца. Я слышал непонятные звуки, издававшиеся оттуда. Это было похоже на стук и шорохи. Я видел высокого человека. Того самого, что был в моем сне. О чем он говорил? И видел ли я его на самом деле?
diary3=Запись в дневнике 3
diary3_text=Теперь я понял кое-что. Практически все это время я убегал от того, что беспокоит меня. Те вещи, что происходили со мной... Большинство людей посчитает это пустяком. Но для меня это настоящая проблема. Просто теперь я знаю, что другого пути у меня нет. У меня нет выбора. Я знаю, куда мне нужно попасть. Откуда я это знаю? Мне этого не понять. :изнь полна странных событий. То, что происходит сейчас. Это очень странно.
olddiary1=Старый дневник 1
olddiary1_text=Мои поиски продвигаются хорошо. Отношения с семьей вроде бы наладились. Они больше не подозревают ничего о моих делах. Это к лучшему. Прочитал несколько интересных книг, что дал мне Арчибальд. В одной из них говорится о катакомбах непонятного происхождения в разных частях мира. Их описание похоже на то, что я видел под нашим домом. Некоторые исследователи предполагают, что их построили в Средневековье сектанты, верования которых остаются неизвестными. Но какой же силой должна обладать подобная организация, чтобы создать настолько запутанные ходы? И их предназначение также пока непонятно. Никаких выходов оттуда я не нашел. Каких либо следов человеческой деятельности тоже нет. Нужно продолжать исследования.
olddiary2=Старый дневник 2
olddiary2_text=Я оборудовал лестницу в сарае, чтобы можно было легко попадать в катакомбы. Также я поставил решетку с замком в самих катакомбах на всякий случай. Каждый день запираю сарай на ночь. На вопросы жены отвечаю, что не знающий человек может все испортить и навредить самому себе. И ведь это действительно так! Такая находка может стать шоком для неподготовленного человека. У него может хватить безрассудства зайти в катакомбы, и он может заблудиться и не выйти оттуда.
olddiary3=Старый дневник 3
olddiary3_text=Я занимаюсь составлением карты катакомб. Они представляют собой сеть комнат одинаковой площади с входами и выходами. Я расчертил лист бумаги на одинаковые квадраты и стал закрашивать отдельные квадраты, которые являются стенами. Вход я обозначил синим цветом. Всю легенду карты я описываю на обратной стороне листа. Здесь много развилок и тупиков, но одно я знаю точно. Есть одна комната, которая должна представлять настоящий интерес.
olddiary4=Старый дневник 4
olddiary4_text=Сегодня я сам чуть не заблудился здесь. Нужно быть внимательней. Чем глубже я захожу, тем сложнее становится помнить маршруты. Я решил чертить карандашом линию, которая будет показывать, где я уже был, чтобы всегда можно было вернуться. Каждый раз я стираю старую линию и начинаю чертить новую. Это может состарить мою карту раньше времени, но я надеюсь, что это случится не так скоро.
olddiary5=Старый дневник 5
olddiary5_text=Я нашел! Нашел! В последнем найденном тупике я обнаружил дыру в полу. Я провел наблюдения и заметил пару вещей. Дна я не нашел. Но я слышал какие-то звуки, доносившиеся оттуда. Описать их сложно, но я могу сделать странное предположение насчет этого. Эти звуки могут иметь биологическую природу. Я не могу быть в этом абсолютно уверенным, и любой человек, услышавший это, посчитал бы меня сумасшедшим. Но Арчибальд может прислушаться к моим мыслям. Надо будет связаться с ним.
olddiary6=Старый дневник 6
olddiary6_text=Арчибальд приехал ко мне пару дней назад. Он останется тут на пару недель. Завтра мы собираемся вместе осмотреть катакомбы. Уверен, он заметит что-нибудь интересное. Ночью из его спальни доносились странные звуки. Это было похоже на молитвы или что-то похожее. Так как наши спальни рядом, я мог слышать это. Я спрашивал у жены, что она об этом думает. Но она говорит, что ничего не слышала. Мне кажется, она не хочет видеть Арчибальда дома. Сын тоже сторонится его, несмотря на все его добродушие. Большую часть времени они просто игнорируют его, как будто его здесь нет. Думаю, пройдет время и они привыкнут к нему.
olddiary7=Старый дневник 7
olddiary7_text=Мы с Арчибальдом осмотрели катакомбы. Он тоже слышал те звуки из колодца. Мы обсуждали их природу весь день. Теперь мы уверены, что они создаются живым существом. Нам нужно найти способ взаимодействовать с ним. Нужно понять, насколько оно развитое. Возможно, это форма жизни, с которой еще не встречался ни один человек в истории! Мне не терпится продолжить работать над этим.
olddiary8=Старый дневник 8
olddiary8_text=Проклятие! Эта мразь куда-то пропала, а вместе с ним и моя семья! Что за чертовщина происходит. Я же проверил везде, даже сходил в лес и катакомбы. Стоп. Я же не осмотрел подвал! Идиот! Как я мог забыть это?! Времени нет, я иду туда.
letter1=Письмо 1
letter1_text=Дорогая, когда ты будешь читать эти строки, я буду уже в пути домой. Ты не можешь представить себе, как я соскучился по тебе и сыну. Ему было всего шесть, когда я уехал, а сейчас ему уже восемь. Время так быстро пролетело. Еще эта ужасная война. Такого мир еще никогда не видел. В своем путешествии я встретил очень интересную личность. Если бы ты могла с ним пообщаться! Больше нет времени, жди еще писем. Люблю тебя.
letter2=Письмо 2
letter2_text=Нашел время, чтобы написать тебе несколько строк. Скоро мы увидимся. Очень жаль, что у меня так мало времени. Я не могу принимать письма, но это не мешает мне продолжать писать тебе. Помнишь, я говорил о своем новом друге? Скорее всего, он сможет приехать погостить у нас. Это не может не радовать меня. Он действительно интересный человек, и вместе с ним наши исследования действительно могут стать чем-то значимым. Возможно, мы сможем разобраться с теми интересными явлениями, происходящими как раз в той зоне, где находится наш дом.
letter3=Письмо 3
letter3_text=Дорогая, я долго думал о том, что происходит между нами. Я надеюсь, ты простила меня, и мы сможем снова зажить как счастливая семья. Я действительно верю в это. Просто мне действительно нужно разобраться во всем.
letter4=Письмо 4
letter4_text=Хочу рассказать тебе одну странную историю, что произошла со мной пару дней назад. Уже второй день подряд меня мучила бессонница. Я ничего не мог с этим поделать, поэтому единственное, что мне оставалось - это продолжать работать при свете свечи. Я уже чувствовал сильную усталость, но сон все никак не шел. Я начал замечать какие-то непонятные звуки за окном гостиницы, где я остановился. Я подошел к нему, чтобы выглянуть и выяснить, что там происходит. Сначала я ничего не заметил, но через пару секунд я увидел человека. Он просто стоял там. Неожиданно мне пришла в голову одна мысль. А ведь он похож на меня. Он действительно выглядел точь в точь как я. В волнении я выбежал на улицу, но там уже никого не было.
letter5=Письмо 5
letter5_text=Здравствуй, Арчибальд! Я уже дома, со своей семьей. Мы очень соскучились друг по другу. Смею тебя заверить, что наше путешествие дало свои плоды в моей работе. Те книги, что ты мне дал, поведали мне о многом. Я составил карту катакомб, что находятся под моим домом. Я оборудовал спуск в сарае, но показывал его семье. Они думают, что я просто там работаю, но они не должны знать, где я нахожусь на самом деле. Это может вызвать бессмысленное беспокойство. Кстати о катакомбах. Там почти ничего нет, но один ход ведет куда-то глубже. Глубже, чем можно себе представить. Я еще не решался туда отправиться, но обязательно сделаю это когда-нибудь. Ведь там может быть то, что именно я ищу.
letter6=Записка
letter6_text=Не ищи меня.
book1=Старая книга
book1_text=...Подобные катакомбы встречаются не только в Европе, но также в Сибири, Африке, а также, как ни странно, в Новом Свете. Это может говорить как о невероятной древности организации, что их построила, так и о их огромной силе. Опять же, цели создания подобных сооружений неизвестны. Каждый из подобных лабиринтов имеет вход, а также что-то наподобие колодца в самых запрятанных закоулках катакомб. Проверить глубину таких колодцев ни у кого так и не получилось. Исследователи отмечают, что слышали звуки, похожие на стук. Из-за их крайней редкости определить их природу не представляется возможным...

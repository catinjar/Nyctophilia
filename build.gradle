plugins {
    id 'java'
    id 'application'
}

group = 'ru.catinbank'
version = '1.1.0'
description = 'Nyctophilia - 2D psychological thriller built on libGDX'

repositories {
    mavenCentral()
}

ext {
    gdxVersion = '1.2.0'
    lwjglVersion = '2.9.1'
    rhinoVersion = '1.8.0'
    gsonVersion = '2.11.0'
    javaTarget = 21
}

// The 2015 project kept sources in src/ and game data in the jar root.
// Mapping assets/ to resources reproduces that layout exactly: Gdx.files.internal("stuff/UI.png")
// and Gdx.files.classpath("bundle") both resolve the same way they did in the shipped build.
sourceSets {
    main {
        java.srcDirs = ['src']
        resources.srcDirs = ['assets']
    }
    smoke {
        java.srcDirs = ['tools/smoke']
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
}

dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    implementation "com.google.code.gson:gson:$gsonVersion"

    // Java 7 shipped Rhino behind javax.script. Java 8 swapped in Nashorn, and Java 15
    // removed it, so getEngineByName("JavaScript") returns null on anything modern.
    // Rhino as an explicit dependency restores the original engine, and scripts/*.js run unchanged.
    implementation "org.mozilla:rhino:$rhinoVersion"
    runtimeOnly "org.mozilla:rhino-engine:$rhinoVersion"

    // Never published to Maven Central. Extracted verbatim from the shipped 2015 build.
    implementation files('libs/gdx-postprocessing-bitfire.jar')

    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    runtimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
    runtimeOnly "org.lwjgl.lwjgl:lwjgl-platform:$lwjglVersion:natives-windows"
    runtimeOnly "org.lwjgl.lwjgl:lwjgl-platform:$lwjglVersion:natives-linux"
    runtimeOnly "org.lwjgl.lwjgl:lwjgl-platform:$lwjglVersion:natives-osx"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaTarget
}

application {
    mainClass = 'ru.catinbank.nyctophilia.desktop.DesktopLauncher'
}

// --enable-native-access only exists from Java 22 on; passing it to 21 stops the JVM dead.
def nativeAccessArgs = {
    Integer.parseInt(JavaVersion.current().majorVersion) >= 22 ? ['--enable-native-access=ALL-UNNAMED'] : []
}

tasks.named('run', JavaExec) {
    jvmArgs nativeAccessArgs()
}

// Single self-contained jar, the same shape the game shipped in.
tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Builds the runnable all-in-one jar'
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
            'Main-Class': application.mainClass.get(),
            'Class-Path': '.',
            // Honoured from Java 24 on, ignored by older JVMs. Silences the JNI
            // restricted-method warnings that libGDX and LWJGL trigger.
            'Enable-Native-Access': 'ALL-UNNAMED'
        )
    }

    from sourceSets.main.output
    from({ configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }) {
        exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/*.EC'
        exclude 'META-INF/MANIFEST.MF', 'META-INF/INDEX.LIST'
        exclude 'module-info.class'
    }
}

tasks.named('build') {
    dependsOn 'fatJar'
}

// Boots the real game class in a window, exercises level loading, Gson, the script
// engine and the i18n bundles, writes screenshots, then quits. Needs a display.
tasks.register('smokeTest', JavaExec) {
    group = 'verification'
    description = 'Boots the game windowed, verifies the whole stack, saves screenshots'
    dependsOn 'smokeClasses'
    mainClass = 'Smoke'
    classpath = sourceSets.smoke.runtimeClasspath
    args layout.buildDirectory.dir('smoke-shots').get().asFile.absolutePath
    jvmArgs nativeAccessArgs()
    doFirst { layout.buildDirectory.dir('smoke-shots').get().asFile.mkdirs() }
}

tasks.named('wrapper', Wrapper) {
    gradleVersion = '9.7.1'
    distributionType = Wrapper.DistributionType.BIN
}
